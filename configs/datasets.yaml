# Benchmarks.
#
# CHANGED: GVD/GVF replaced. GVF is prompt-aligned and well controlled, but
# both it and GenVideo sample the same question -- "fully generated by
# 2023-era models" -- and GenVideo belongs to the companion paper.
#
# The two benchmarks below give the two axes that differentiate this work:
#   manipulation type  (FakeParts: is disagreement sensitive to localized edits?)
#   generator recency  (ViF-Bench: does it survive Sora-2, Wan2.2, Kling?)
#
# Both are evaluated by SPLIT (ECCV 2026), so if its released code is run on
# our videos every comparison uses one method, one metric, one source. Mixing
# STALL's AUROC on one benchmark with SPLIT's Fake Recall on another would
# not be a comparison.
#
# ⚠️ Published numbers from either paper are NOT directly citable as
# baselines: STALL uses 16 frames at encoder-native resolution, SPLIT uses
# 8 fps at 224 with a 10% crop, and we use 32 frames at 384. Different pixels,
# different metrics. Run their code on our videos or do not compare.
#
# ⚠️ Run `python -m src.dataset_audit` on each before extracting. Provenance
# and frame-duplication properties are unverified for both.

fakeparts:
  enabled: false
  root: /data/FakeParts
  source_paper: brison2025fakeparts
  hf_repo: hi-paris/FakeParts
  download: hf download hi-paris/FakeParts --repo-type dataset --local-dir /data/FakeParts
  license: CC0-1.0 (data), BSD-3-Clause (code)
  size: "76,328 videos total: 64,253 generated + 12,075 real"
  role: manipulation-type axis
  categories: >
    SUPERSEDES an earlier version of this file, which used a much smaller
    total (25,000 generated) read from what was believed to be the paper's
    Table 3. A more complete, citation-annotated description (sourced from a
    paper that evaluates on FakeParts, not from re-reading the FakeParts
    paper directly) gives a materially different picture:

      T2V            16,119  (9 distinct generator citations -- NOT a fixed
                               three-system split as the earlier version
                               assumed)
      Inpainting     13,577
      Interpolation  10,000
      Outpainting     7,275
      Style Change    5,266
      Faceswap        5,036
      TI2V            3,980
      Extrapolation   3,000  (RESTORED -- an earlier version of this file
                               removed "Extrapolation" as not present in the
                               released taxonomy, based on the Table 3 read.
                               This new source confirms it exists, with its
                               own citation [35] and an exact count.)
      -------------------------------
      Total generated 64,253

    NOTE: unlike the real-video folder counts below, this generated-video
    total is now CONFIRMED against the downloaded generated-video files,
    counted the same way the five real folders were (4,209 + 2,156 + 2,156 +
    2,149 + 1,405 = 12,075). Both real and generated counts for FakeParts are
    independently verified as of this confirmation.

    There is also NO SEPARATE I2V CATEGORY in this source, unlike an earlier
    version of this file which assumed T2V/I2V/TI2V were three conditioning
    modes of the same three systems (Sora, Veo2, Allegro AI) at 1,000 each.
    That framing is now known to be wrong and has been removed from the
    manuscript prose describing this benchmark.
  real_sources: [DAVIS 2016, DAVIS 2017, YouTube-VOS 2019, MOSE, LVD-2M]
                      # CONFIRMED by direct download, RECOUNTED with a
                      # corrected folder-1 figure (4,290 -> 4,209; earlier
                      # value was a transposition):
                      #   folder 1  4,209
                      #   folder 2  2,156
                      #   folder 3  2,156   <- identical count to folder 2;
                      #                        verify these are independent
                      #                        (diff the filename lists, or
                      #                        run `dataset_audit.py purity`)
                      #                        before treating that pair as a
                      #                        genuine provenance comparison
                      #   folder 4  2,149
                      #   folder 5  1,405
                      #   total    12,075
                      # Balance still fine: largest:smallest ~= 3.0, every
                      # folder in the thousands. All 10 pairwise comparisons
                      # usable, pending the folder-2/folder-3 independence
                      # check.
  note: >
    Localized edits applied to otherwise real video, with per-category
    labels. Detectors lose up to half their performance on categories like
    this. T2V draws on at least 9 distinct generation systems per this
    source's citations -- a substantially more diverse pool than earlier
    assumed, which strengthens rather than weakens the "does the effect
    generalise across generators" question this category can answer on its
    own, independent of ViF-Bench.

vif_bench:
  enabled: false
  root: /data/ViF-Bench
  source_paper: li2026skyra   # introduced by Skyra, CVPR 2026 -- not a
                              # standalone "ViF-Bench" paper
  hf_repo: JoeLeelyf/ViF-Bench
  download: hf download JoeLeelyf/ViF-Bench --repo-type dataset --local-dir /data/ViF-Bench
  size: "8.83 GB on the HF repo; ~3,000 samples across 19 generators"
  role: generator-recency axis
  generators: >
    19 systems, EXACT per-generator video counts, confirmed against Skyra's
    own Table 10 (the six commercial models match number-for-number) and
    summing to 2,995, which matches Figure 4's ViF-Bench (test) total:
      T2V (14):
        CogVideoX1.5-T          165    HunyuanVideo             164
        LTX-Video (T2V)         165    SkyReels-V2 (T2V)        165
        Wan2.1-T2V-1.3B         165    VACE-1.3B-T              165
        Wan2.2-T2V-A14B         165    Wan2.2-TI2V-5B (T2V)     165
        Gen4-turbo              121    Hailuo-02                137
        Kling-V1                141    Pika-V2                  151
        Pixverse-V4-5           152    Sora-2                   150
      I2V (5):
        HunyuanVideo-I2V        165    LTX-Video (I2V)          165
        SkyReels-V2 (I2V)       164    Wan2.2-I2V-A14B          165
        Wan2.2-TI2V-5B (I2V)    165
    -------------------------------------------------------------
    Generated total  2,995
    Real             165     (confirmed present -- see real_videos below)
    ViF-Bench total  3,160
    Mix of open-source (Wan, HunyuanVideo, CogVideoX, SkyReels-V2, LTX-Video)
    and closed commercial (Gen4-turbo, Hailuo-02, Kling-V1, Pika-V2,
    Pixverse-V4-5, Sora-2) systems, capped near 165 per generator with the
    six API-based commercial systems lower (121-152), presumably a cost
    constraint. Several base models appear twice under different
    conditioning modes and are counted as separate generators, since they
    are evaluated and reported separately.
    SUPERSEDES an earlier, incorrect version of this file which gave a
    3,650 total with different per-generator counts (154/172/176/186/183/182
    for the six commercial models). That set does not match Skyra's own
    Table 10 and should be treated as wrong.
  real_videos: 165   # CONFIRMED present and CONFIRMED pooled: downloaded
                      # directly from HF, all 165 sit in one folder with no
                      # per-source label or filename attribution. The
                      # real-vs-real provenance control CANNOT run on
                      # ViF-Bench as distributed -- this is settled, not a
                      # guess. Use GVD for that control instead (see below).
  real_sources: [Panda-70M, Kinetics-400, HD-VILA-100M]  # combined pool per
                      # the paper's construction description; NOT separable
                      # in the released files. Kept here for documentation
                      # only -- do not attempt to stratify by this.
  license: >
    ViF-CoT-4K and Skyra model weights are CC BY 4.0. ViF-Bench itself
    requires compliance with the source datasets' own licenses (Kinetics-400,
    Panda-70M, HD-VILA-100M) -- check each before redistributing anything
    derived from this benchmark.
  note: >
    Also used by SPLIT (ECCV 2026) as one of its three benchmarks, where D3
    falls to 0.97% Fake Recall at 0.1% FPR -- corroborating evidence this is
    a sound choice independent of Skyra adopting it.

    CARRIES THE PROVENANCE CONTROLS. Three distinct real corpora, so the
    real-versus-real comparison runs here. Classes are content-aligned by
    construction: prompts are derived from descriptions of the real clips
    and filtered for semantic consistency, and image-to-video systems are
    conditioned on first frames taken from the real videos themselves.

    CAUTION: HD-VILA is included specifically as a high-resolution
    generalization test, so the real set spans a wide resolution range by
    design. Stratify the real-versus-real comparison by corpus rather than
    pooling.

# ---------------------------------------------------------------------
# CONSIDERED AND SET ASIDE
# ---------------------------------------------------------------------
videofeedback:
  enabled: false
  excluded: true
  url: https://huggingface.co/datasets/TIGER-Lab/VideoFeedback
  note: >
    Best-controlled option on the list: two real corpora (DiDeMo, Panda-70M),
    everything at 8 FPS natively so no frame-duplication hazard, composition
    documented in STALL Table 7. If the provenance controls prove difficult
    elsewhere, switch to this.
    Set aside because its generators are mostly 2023 -- AnimateDiff, LVDM,
    ModelScope, ZeroScope -- and an effect demonstrated only on those invites
    the obvious objection. ~30k generated videos is also a large extraction
    for one 8 GB GPU.

genvideo:
  enabled: false
  excluded: true
  reason: >
    The companion paper's benchmark. Also the benchmark where STALL documented
    a 23-point AP artifact from frame duplication in its MSR-VTT real videos.

gvf:
  enabled: false
  excluded: true
  reason: >
    Prompt-aligned and well controlled, but samples the same question as
    VideoFeedback with older generators, and requires assembly from three
    sources. Superseded by FakeParts + ViF-Bench.
    src/build_gvf.py is retained in case this decision is revisited.

compression_sweep:
  codec: libx264
  crf: [18, 23, 28, 32]
  applies_to: [fakeparts]
  note: Re-encoding invalidates the feature cache; separate extraction pass.
